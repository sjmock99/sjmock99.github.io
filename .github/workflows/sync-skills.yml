# Refreshes the site's generated files from the Notion Engineering Wiki (assets/data/skills.json, the generated
# parts of index.html, the project pages in projects/, their photos in assets/img/projects/ and job / school logos
# in assets/img/logos/) and commits them
# if they changed.
# Needs repo secret NOTION_API (the Notion integration key). Optional repo variable SHOW_ALL=true to ignore the Public checkbox.
name: Sync skills from Notion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements (Pillow, which resizes project photos)
        run: pip install -r requirements.txt
      - name: Pull Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API }}
          SHOW_ALL: ${{ vars.SHOW_ALL }}
        run: python3 scripts/sync_notion.py
      - name: Commit if changed
        run: |
          git add -A -- assets/data/skills.json index.html projects assets/img/projects assets/img/logos
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skills from Notion"
          git push

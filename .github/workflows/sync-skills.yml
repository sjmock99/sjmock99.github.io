# Refreshes assets/data/skills.json and the generated resume in index.html from the Notion Engineering Wiki,
# and commits them if they changed.
# Needs repo secret NOTION_API (the Notion integration key). Optional repo variable SHOW_ALL=true to ignore the Public checkbox.
name: Sync skills from Notion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API }}
          SHOW_ALL: ${{ vars.SHOW_ALL }}
        run: python3 scripts/sync_notion.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/skills.json index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/skills.json index.html
          git commit -m "Sync skills from Notion"
          git push
